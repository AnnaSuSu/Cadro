name: Deploy Cloudflare Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - name: Check deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable deployment.'
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.credentials.outputs.configured == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.credentials.outputs.configured == 'true'
        with:
          node-version: 24
      - name: Build Pages assets
        if: steps.credentials.outputs.configured == 'true'
        run: |
          corepack enable pnpm
          corepack pnpm install --frozen-lockfile
          pnpm build:pages
          node scripts/apply-web-brand-assets.ts production apps/web/dist
      - uses: cloudflare/wrangler-action@v4
        if: steps.credentials.outputs.configured == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: pages deploy apps/web/dist
